plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-kapt'
    id 'kotlinx-serialization'
    id "app.cash.sqldelight" version "2.0.0-rc01"
    id "com.google.protobuf" version "0.9.1"
}

android {
    namespace 'eu.wedgess.mihole'
    compileSdk 34

    defaultConfig {
        applicationId "eu.wedgess.mihole"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.3.2'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

kapt {
    correctErrorTypes true
}

sqldelight {
    databases {
        MiHoleDatabase {
            packageName = "eu.wedgess.mihole.data"
        }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.20.0"
    }

    // Generates the java Protobuf-lite code for the Protobufs in this project. See
    // https://github.com/google/protobuf-gradle-plugin#customizing-protobuf-compilation
    // for more information.
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

dependencies {

    def compose_version = "1.5.0-beta03"
    def camerax_version = "1.3.0-beta01"

    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.activity:activity-compose:1.7.2'

    implementation "androidx.compose.material:material-icons-extended:1.4.3"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.6.1"
    implementation "androidx.compose.ui:ui:${compose_version}"
    implementation "androidx.compose.ui:ui-graphics:${compose_version}"
    implementation "androidx.compose.ui:ui-tooling-preview:${compose_version}"
    implementation 'androidx.compose.material3:material3:1.1.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2022.10.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation "app.cash.sqldelight:android-driver:2.0.0-rc01"
    implementation "app.cash.sqldelight:coroutines-extensions:2.0.0-rc01"

    // Timber logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    implementation 'com.jakewharton.threetenabp:threetenabp:1.4.6'

    implementation "androidx.navigation:navigation-compose:2.7.0-beta02"

    // hilt
    implementation "com.google.dagger:hilt-android:2.44.2"
    kapt "com.google.dagger:hilt-compiler:2.44.2"
    implementation 'androidx.hilt:hilt-navigation-compose:1.0.0'

    implementation "io.ktor:ktor-client-core:2.3.1"
    implementation "io.ktor:ktor-client-android:2.3.1"
    implementation "io.ktor:ktor-client-serialization:2.3.1"
    implementation "io.ktor:ktor-client-logging:2.3.1"
    implementation "io.ktor:ktor-client-content-negotiation:2.3.1"
    implementation "io.ktor:ktor-serialization-kotlinx-json:2.3.1"
    implementation("io.ktor:ktor-client-okhttp:2.3.1")
    implementation("io.ktor:ktor-client-auth:2.3.1")


    implementation "com.patrykandpatrick.vico:compose-m3:1.6.5"

    implementation "androidx.compose.foundation:foundation:1.4.3"

    implementation  "androidx.datastore:datastore:1.0.0"
    implementation  "com.google.protobuf:protobuf-javalite:3.23.3"

    implementation "com.google.accompanist:accompanist-systemuicontroller:0.30.1"

    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation "androidx.camera:camera-extensions:$camerax_version"
    implementation "com.google.mlkit:barcode-scanning:17.1.0"
}
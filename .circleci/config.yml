version: 2.1

executors:
  android-executor:
    docker:
      - image: alvrme/alpine-android:android-34-jdk17

jobs:
  build-debug:
    executor: android-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-cache-{{ checksum "build.gradle" }}
            - gradle-cache-
      - run:
          name: Build Debug APK
          command: |
            chmod +x ./gradlew
            ./gradlew assembleDebug
      - save_cache:
          key: gradle-cache-{{ checksum "build.gradle" }}
          paths:
            - ~/.gradle/caches/
            - ~/.gradle/wrapper/
      - store_artifacts:
          path: app/build/outputs/
          destination: outputs

  lint:
    executor: android-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-cache-{{ checksum "build.gradle" }}
            - gradle-cache-
      - run:
          name: Run Lint
          command: |
            chmod +x ./gradlew
            ./gradlew lint
      - store_artifacts:
          path: app/build/reports/
          destination: reports

  unit-tests:
    executor: android-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-cache-{{ checksum "build.gradle" }}
            - gradle-cache-
      - run:
          name: Run Unit Tests
          command: |
            chmod +x ./gradlew
            ./gradlew testDebugUnitTest

workflows:
  version: 2
  parallel-workflow:
    jobs:
      - build-debug
      - lint
      - unit-tests
